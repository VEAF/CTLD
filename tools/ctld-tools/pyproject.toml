[tool.poetry]
name = "ctld-tools"
version = "0.1.0"
description = "CTLD configuration authoring & generation tools"
authors = ["VEAF <https://www.veaf.org>"]
license = "MIT"
readme = "README.md"
package-mode = true
packages = [{ include = "ctld_tools" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.12,<1"
"ruamel.yaml" = ">=0.18,<1.0"
rich = ">=13.0,<15"
# Local web app (CTLD-TOOLS-WEBAPP): FastAPI backend + uvicorn server, shipped in the exe.
fastapi = ">=0.110,<1"
uvicorn = ">=0.29,<1"
psutil = ">=5.9"  # parent-process-tree walk for double-click detection (VMCT pattern)

[tool.poetry.scripts]
ctld-tools = "ctld_tools.cli:main"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4"
mypy = ">=1.8"
pytest = ">=8.0"
pytest-cov = ">=5.0"
httpx = ">=0.27"  # FastAPI TestClient transport

[tool.poetry.group.build.dependencies]
# Only needed to build the MM .exe (lot 3); excluded from the quality gate.
pyinstaller = { version = ">=6.0", python = "<3.15" }

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "dist", "build", "ctld_tools/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["F401"]

# ---------------------------------------------------------------------------
# Mypy — type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["ctld_tools"]
exclude = ["ctld_tools/vendor"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "--tb=short",
    "-q",
    "--import-mode=importlib",
    "--cov=ctld_tools",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
]

[tool.coverage.run]
source = ["ctld_tools"]
omit = ["*/test_*.py", "*/vendor/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

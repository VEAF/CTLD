# CTLD settings schema — authoring metadata for ctld-tools (the TUI / validate).
#
# NOT consumed by the build (gen-config) — it only guides the authoring tool. Additive:
# one entry per setting name, with any of:
#   choices:      allowed values (a fixed enum) — offered as a value list in the TUI
#   description:  { en, fr } help text — shown and searchable in the settings picker
#
# Descriptions were seeded from docs/mission-maker/configuration(.fr).md; the schema is
# now their source of truth (see dev/roadmap.md: generate the doc tables from it).

configVersion:
  description:
    en: Schema/catalogue version this config is authored against (used for version-gap detection).
    fr: Version du schéma/catalogue contre laquelle cette config est écrite (détection d'écart de version).

JTAC_lock:
  choices: [all, vehicle, troop]
  description:
    en: 'Target filter: "vehicle" | "troop" | "all"'
    fr: 'Filtre de cible : "vehicle" | "troop" | "all"'

i18n_lang:
  # Not in the engine defaults catalogue (it is a bare `ctld.i18n_lang` global read by
  # CTLD_i18n); `default` here surfaces it in the TUI picker. The user-config value, when
  # set, lands in settings and wins via ctld.gs("i18n_lang").
  default: en
  choices: [en, fr, es, ko]
  description:
    en: 'CTLD interface language: en, fr, es or ko'
    fr: "Langue de l'interface CTLD : en, fr, es ou ko"
AASystemCrateStacking:
  description:
    en: Allow multiple crate sets to add extra launchers (N×crates → N×launchers)
    fr: Autorise plusieurs jeux de crate à ajouter des launchers supplémentaires (N×crates → N×launchers)
AASystemLimitBLUE:
  description:
    en: Max active AA systems for BLUE
    fr: Nombre max de systèmes AA actifs pour BLUE
AASystemLimitRED:
  description:
    en: Max active AA systems for RED
    fr: Nombre max de systèmes AA actifs pour RED
CIV_WEIGHT:
  description:
    en: Light personal items for the civilian role (kg)
    fr: Effets personnels légers pour le rôle civil (kg)
JTAC_LIMIT_BLUE:
  description:
    en: Max JTAC objects BLUE may spawn (fixed quota — not refilled when a JTAC is killed)
    fr: Nombre max d'objets JTAC que BLUE peut spawn (quota fixe — non réapprovisionné lorsqu'un JTAC est tué)
JTAC_LIMIT_RED:
  description:
    en: Max JTAC objects RED may spawn (same)
    fr: Nombre max d'objets JTAC que RED peut spawn (idem)
JTAC_WEIGHT:
  description:
    en: JTAC laser + radio + binoculars (kg)
    fr: Laser + radio + jumelles du JTAC (kg)
JTAC_allow9Line:
  description:
    en: Allow 9-line requests
    fr: Autorise les requêtes 9-line
JTAC_allowSmokeRequest:
  description:
    en: Allow smoke-on-target requests
    fr: Autorise les requêtes de smoke-on-target
JTAC_allowStandbyMode:
  description:
    en: Allow toggling lasing on/off
    fr: Autorise l'activation/désactivation du lasing
JTAC_droneAltitude:
  description:
    en: Fallback orbit altitude AGL (m) for drone JTACs when the crate has no specificParams
    fr: Altitude d'orbite de repli AGL (m) pour les JTAC drones quand la crate n'a pas de specificParams
JTAC_droneRadius:
  description:
    en: Fallback orbit radius (m) for drone JTACs when the crate has no specificParams
    fr: Rayon d'orbite de repli (m) pour les JTAC drones quand la crate n'a pas de specificParams
JTAC_dropEnabled:
  description:
    en: Allow JTAC crate spawn from F10
    fr: Autorise le spawn de crate JTAC depuis F10
JTAC_laseSpotCorrections:
  description:
    en: Lead moving targets, accounting for wind and target speed
    fr: Anticipe les cibles mobiles, en tenant compte du vent et de la vitesse de la cible
JTAC_maxDistance:
  description:
    en: JTAC line-of-sight range (metres)
    fr: Portée en ligne de vue du JTAC (mètres)
JTAC_smokeColour_BLUE:
  description:
    en: BLUE JTAC smoke colour — 0=Green 1=Red 2=White 3=Orange 4=Blue
    fr: Couleur de smoke du JTAC BLUE — 0=Green 1=Red 2=White 3=Orange 4=Blue
JTAC_smokeColour_RED:
  description:
    en: RED JTAC smoke colour — 0=Green 1=Red 2=White 3=Orange 4=Blue
    fr: Couleur de smoke du JTAC RED — 0=Green 1=Red 2=White 3=Orange 4=Blue
JTAC_smokeMarginOfError:
  description:
    en: Max random placement error radius (m) for smoke
    fr: Rayon max d'erreur de placement aléatoire (m) pour la smoke
JTAC_smokeOffset_x:
  description:
    en: Fixed East/West offset (m) added before the random error
    fr: Offset Est/Ouest fixe (m) ajouté avant l'erreur aléatoire
JTAC_smokeOffset_y:
  description:
    en: Fixed vertical offset (m) — keeps smoke visible above terrain
    fr: Offset vertical fixe (m) — garde la smoke visible au-dessus du terrain
JTAC_smokeOffset_z:
  description:
    en: Fixed North/South offset (m) added before the random error
    fr: Offset Nord/Sud fixe (m) ajouté avant l'erreur aléatoire
JTAC_smokeOn_BLUE:
  description:
    en: Enable smoke marking for BLUE JTACs
    fr: Active le marquage smoke pour les JTAC BLUE
JTAC_smokeOn_RED:
  description:
    en: Enable smoke marking for RED JTACs
    fr: Active le marquage smoke pour les JTAC RED
KIT_WEIGHT:
  description:
    en: Helmet + backpack per soldier (kg)
    fr: Casque + sac à dos par soldat (kg)
MANPAD_WEIGHT:
  description:
    en: AA soldier MANPAD tube (kg)
    fr: Tube MANPAD du soldat AA (kg)
MG_WEIGHT:
  description:
    en: Machine-gunner weapon + 200-round belt (kg)
    fr: Arme du mitrailleur + bande de 200 cartouches (kg)
MORTAR_WEIGHT:
  description:
    en: Mortar crew tube + shells (kg)
    fr: Tube + obus de l'équipe de mortier (kg)
RIFLE_WEIGHT:
  description:
    en: Standard rifleman kit (kg)
    fr: Équipement standard de fusilier (kg)
RPG_WEIGHT:
  description:
    en: AT soldier RPG + rocket (kg)
    fr: RPG + roquette du soldat AT (kg)
SOLDIER_WEIGHT:
  description:
    en: Base body weight per soldier (kg)
    fr: Poids corporel de base par soldat (kg)
aaLaunchers:
  description:
    en: Default number of launchers per AA system when the template does not specify
    fr: Nombre par défaut de launchers par système AA quand le template n'en précise pas
addPlayerAircraftByType:
  description:
    en: How CTLD selects player units that receive menus
    fr: Comment CTLD sélectionne les unités joueur qui reçoivent les menus
allowRandomAiTeamPickups:
  description:
    en: Allow AI transports to randomly pick a troop template at pickup zones. When false, the AI always picks the first available template for its coalition
    fr: Autorise les transports IA à choisir aléatoirement un template de troop aux zones de pickup. Si false, l'IA prend toujours le premier template disponible pour sa coalition
ctldLogPath:
  description:
    en: Override the log file path; empty = default DCS Saved Games folder
    fr: Surcharge le chemin du fichier de log ; vide = dossier Saved Games DCS par défaut
debug:
  description:
    en: Verbose logging to CTLD.log (requires a non-sanitized DCS install)
    fr: Journalisation verbeuse vers CTLD.log (nécessite une installation DCS non sanitized)
debugScreenLog:
  description:
    en: Also echo log messages to the DCS screen via outText
    fr: Répète aussi les messages de log à l'écran DCS via outText
demineRadius:
  description:
    en: Max distance (m) from the player to the minefield centre for the "Clear Mine Field" entry to appear
    fr: Distance max (m) du joueur au centre du minefield pour que l'entrée « Clear Mine Field » apparaisse
deployedBeaconBattery:
  description:
    en: Beacon battery life (minutes)
    fr: Durée de vie de la batterie du beacon (minutes)
disableAllSmoke:
  description:
    en: Globally disable all smoke at pickup and drop-off zones
    fr: Désactive globalement toute la smoke aux zones de pickup et de drop-off
enableAllCrates:
  description:
    en: Show the "All crates" shortcut entries in the Request Equipment menus. Set false to keep only individual crate entries
    fr: Affiche les entrées raccourci « All crates » dans les menus Request Equipment. Mettre à false pour ne conserver que les entrées de crate individuelles
enableCrates:
  description:
    en: Master switch for crate spawning and unpacking
    fr: Interrupteur maître pour le spawn et le déballage des crate
enableFARPRepack:
  description:
    en: Allow players to pack a deployed FARP scene back into crates for redeployment
    fr: Autorise les joueurs à pack une scène FARP déployée de nouveau en crate pour redéploiement
enableFastRopeInsertion:
  description:
    en: Allow fast-rope deployment
    fr: Autorise le déploiement en fast-rope
enableHoverSlingload:
  description:
    en: Allow crate loading by hovering above it. If false, crates load only via the F10 menu (loadCrateFromMenu)
    fr: Autorise le chargement de crate en hover au-dessus. Si false, les crate ne se chargent que via le menu F10 (loadCrateFromMenu)
enablePackingVehicles:
  description:
    en: Allow vehicles to be packed back into crates
    fr: Autorise le pack des véhicules de nouveau en crate
enableSmokeDrop:
  description:
    en: Enable the "Drop Smoke" F10 entry
    fr: Active l'entrée F10 « Drop Smoke »
enabledFOBBuilding:
  description:
    en: Allow FOB construction from crates
    fr: Autorise la construction de FOB depuis des crate
enabledRadioBeaconDrop:
  description:
    en: Allow beacon deployment
    fr: Autorise le déploiement de beacon
fastRopeMaximumHeight:
  description:
    en: Max height (m) for fast-rope insertion (≈ 60 ft)
    fr: Hauteur max (m) pour l'insertion fast-rope (≈ 60 ft)
fobDestructionThreshold:
  description:
    en: Fraction of scene objects destroyed before a FOB is considered lost (0.0–1.0)
    fr: Fraction d'objets de scène détruits avant qu'un FOB soit considéré perdu (0.0–1.0)
fobLogisticZoneRadius:
  description:
    en: Radius (m) of the logistic zone created around a deployed FOB
    fr: Rayon (m) de la zone logistique créée autour d'un FOB déployé
fobMinDistanceFromZones:
  description:
    en: Minimum distance (m) from any logistic zone at which a FOB may be deployed
    fr: Distance minimale (m) de toute zone logistique à laquelle un FOB peut être déployé
fobTroopPickupRadius:
  description:
    en: Radius (m) within which troops may board at a FOB
    fr: Rayon (m) dans lequel les troops peuvent embarquer à un FOB
loadCrateFromMenu:
  description:
    en: Allow crate loading via the F10 menu (useful for fixed-wing that cannot hover)
    fr: Autorise le chargement de crate via le menu F10 (utile pour les fixed-wing incapables de hover)
location_DMS:
  description:
    en: Show coordinates as Degrees-Minutes-Seconds instead of Degrees-Decimal-Minutes
    fr: Affiche les coordonnées en Degrés-Minutes-Secondes au lieu de Degrés-Minutes-Décimales
maxExtractDistance:
  description:
    en: Max distance from the vehicle to troops for extraction
    fr: Distance max entre le véhicule et les troops pour l'extraction
maximumDistanceLogistic:
  description:
    en: Max distance from a logistics zone to load or spawn a crate
    fr: Distance max depuis une zone logistique pour charger ou spawn une crate
maximumDistancePackableUnitsSearch:
  description:
    en: Max distance to search for packable vehicles
    fr: Distance max pour chercher des véhicules pack-ables
maximumSearchDistance:
  description:
    en: Max distance for deployed AI troops to search for enemies
    fr: Distance max pour que les troops IA déployées cherchent des ennemis
numberOfTroops:
  description:
    en: Default / max troop group size per transport (overridden per aircraft by maxTroopsOnboard)
    fr: Taille de groupe de troops par défaut / max par transport (surchargée par appareil via maxTroopsOnboard)
radioSound:
  description:
    en: Beacon sound file — must be added to the mission .miz, or beacons will not work
    fr: Fichier son du beacon — doit être ajouté au .miz de la mission, sinon les beacon ne fonctionneront pas
radioSoundFC3:
  description:
    en: Silent beacon file for FC3 aircraft
    fr: Fichier de beacon silencieux pour les appareils FC3
reconEnabled:
  description:
    en: Master switch — must be true for scan commands to work
    fr: Interrupteur maître — doit être true pour que les commandes de scan fonctionnent
reconF10Menu:
  description:
    en: Enable the RECON F10 submenu
    fr: Active le sous-menu F10 RECON
reconIconScale:
  description:
    en: Icon size multiplier (1.0 = default, 2.0 = double)
    fr: Multiplicateur de taille d'icône (1.0 = défaut, 2.0 = double)
reconMinAltitude:
  description:
    en: Minimum AGL altitude (m) required to perform a scan
    fr: Altitude AGL minimale (m) requise pour effectuer un scan
reconRefreshInterval:
  description:
    en: Auto-refresh interval (seconds)
    fr: Intervalle de rafraîchissement automatique (secondes)
reconSearchRadius:
  description:
    en: Line-of-sight scan radius (metres)
    fr: Rayon de scan en ligne de vue (mètres)
showMinefieldOnF10Map:
  description:
    en: Draw a bounding quad on the F10 map when a minefield is deployed
    fr: Dessine un quadrilatère englobant sur la carte F10 lorsqu'un minefield est déployé
slingLoad:
  description:
    en: Use DCS sling-load physics instead of the virtual hover system
    fr: Utilise la physique sling-load de DCS au lieu du système virtuel de hover
troopPickupAtFOB:
  description:
    en: Allow troop pickup at built FOBs
    fr: Autorise le pickup de troops aux FOB construits

aaRearmDistance:
  description:
    en: Max distance (m) from a launcher crate to an existing AA system to rearm/repair it
    fr: Distance max (m) entre une caisse de lanceur et un système AA existant pour le réarmer/réparer
aaAssemblyDistance:
  description:
    en: Max distance (m) between crates and the reference point to assemble an AA system
    fr: Distance max (m) entre les caisses et le point de référence pour assembler un système AA
beaconRemovalRadius:
  description:
    en: Search radius (m) for the "Remove Closest Beacon" action
    fr: Rayon de recherche (m) pour l'action « Retirer la balise la plus proche »
loadCrateSearchRadius:
  description:
    en: Radius (m) within which crates are grouped/loadable from the Load Crate menu
    fr: Rayon (m) dans lequel les caisses sont regroupées/chargeables depuis le menu Charger une caisse
unpackSearchRadius:
  description:
    en: Radius (m) within which crates are gathered to unpack or list nearby crates
    fr: Rayon (m) dans lequel les caisses sont rassemblées pour le dépaquetage ou la liste des caisses proches
fobCrateCollectionRadius:
  description:
    en: Radius (m) within which FOB crates must be gathered to deploy a FOB
    fr: Rayon (m) dans lequel les caisses de FOB doivent être rassemblées pour déployer un FOB
slingCutDestroyHeight:
  description:
    en: AGL height (m) above which cutting a slingload destroys the crate on impact
    fr: Hauteur AGL (m) au-dessus de laquelle couper une élingue détruit la caisse à l'impact
jtacLaserCodeMin:
  description:
    en: Lowest assignable JTAC laser code (NATO range)
    fr: Code laser JTAC assignable le plus bas (plage OTAN)
jtacLaserCodeMax:
  description:
    en: Highest assignable JTAC laser code (NATO range)
    fr: Code laser JTAC assignable le plus haut (plage OTAN)
defaultVehicleWeight:
  description:
    en: Weight (kg) assumed for a loaded vehicle type absent from groundVehicleWeights
    fr: Poids (kg) supposé pour un type de véhicule chargé absent de groundVehicleWeights
fieldExtractTroopWeight:
  description:
    en: Assumed per-troop weight (kg) when extracting a field group with no stored data
    fr: Poids par troupe supposé (kg) lors de l'extraction d'un groupe de terrain sans données stockées
defaultZoneRadius:
  description:
    en: Default radius (m) when a discovered TRZ/WPZ/AIZ trigger zone lacks one
    fr: Rayon par défaut (m) quand une zone trigger TRZ/WPZ/AIZ découverte n'en a pas

# CTLD settings schema — authoring metadata for ctld-tools (the TUI / validate).
#
# NOT consumed by the build (gen-config) — it only guides the authoring tool. Additive:
# one entry per setting name, with any of:
#   group:        functional family key (maps to tui.family.<key> i18n string)
#   standard:     true = shown in Standard sub-node; false/absent = Advanced
#   choices:      allowed values (a fixed enum) — offered as a value list in the TUI
#   description:  { en, fr } help text — shown and searchable in the settings picker
#
# Descriptions were seeded from docs/mission-maker/configuration(.fr).md; the schema is
# now their source of truth (see dev/roadmap.md: generate the doc tables from it).

# ── Général ──────────────────────────────────────────────────────────────────
i18n_lang:
  group: general
  standard: true
  # Not in the engine defaults catalogue (it is a bare `ctld.i18n_lang` global read by
  # CTLD_i18n); `default` here surfaces it in the TUI picker. The user-config value, when
  # set, lands in settings and wins via ctld.gs("i18n_lang").
  default: en
  choices: [en, fr, es, ko]
  description:
    en: 'CTLD interface language: en, fr, es or ko'
    fr: "Langue de l'interface CTLD : en, fr, es ou ko"
location_DMS:
  group: general
  standard: true
  description:
    en: Show coordinates as Degrees-Minutes-Seconds instead of Degrees-Decimal-Minutes
    fr: Affiche les coordonnées en Degrés-Minutes-Secondes au lieu de Degrés-Minutes-Décimales
radioSound:
  group: general
  standard: true
  description:
    en: Beacon sound file — must be added to the mission .miz, or beacons will not work
    fr: Fichier son du beacon — doit être ajouté au .miz de la mission, sinon les beacon ne fonctionneront pas
radioSoundFC3:
  group: general
  standard: true
  description:
    en: Silent beacon file for FC3 aircraft
    fr: Fichier de beacon silencieux pour les appareils FC3
addPlayerAircraftByType:
  group: general
  description:
    en: How CTLD selects player units that receive menus
    fr: Comment CTLD sélectionne les unités joueur qui reçoivent les menus
debug:
  group: general
  description:
    en: Verbose logging to CTLD.log (requires a non-sanitized DCS install)
    fr: Journalisation verbeuse vers CTLD.log (nécessite une installation DCS non sanitized)
debugScreenLog:
  group: general
  description:
    en: Also echo log messages to the DCS screen via outText
    fr: Répète aussi les messages de log à l'écran DCS via outText
ctldLogPath:
  group: general
  description:
    en: Override the log file path; empty = default DCS Saved Games folder
    fr: Surcharge le chemin du fichier de log ; vide = dossier Saved Games DCS par défaut

# ── Caisses ──────────────────────────────────────────────────────────────────
enableCrates:
  group: crates
  standard: true
  description:
    en: Master switch for crate spawning and unpacking
    fr: Interrupteur maître pour le spawn et le déballage des crate
enableAllCrates:
  group: crates
  standard: true
  description:
    en: Show the "All crates" shortcut entries in the Request Equipment menus. Set false to keep only individual crate entries
    fr: Affiche les entrées raccourci « All crates » dans les menus Request Equipment. Mettre à false pour ne conserver que les entrées de crate individuelles
loadCrateFromMenu:
  group: crates
  standard: true
  description:
    en: Allow crate loading via the F10 menu (useful for fixed-wing that cannot hover)
    fr: Autorise le chargement de crate via le menu F10 (utile pour les fixed-wing incapables de hover)
enableHoverSlingload:
  group: crates
  standard: true
  description:
    en: Allow crate loading by hovering above it. If false, crates load only via the F10 menu (loadCrateFromMenu)
    fr: Autorise le chargement de crate en hover au-dessus. Si false, les crate ne se chargent que via le menu F10 (loadCrateFromMenu)
slingLoad:
  group: crates
  standard: true
  description:
    en: Use DCS sling-load physics instead of the virtual hover system
    fr: Utilise la physique sling-load de DCS au lieu du système virtuel de hover
enablePackingVehicles:
  group: crates
  standard: true
  description:
    en: Allow vehicles to be packed back into crates
    fr: Autorise le pack des véhicules de nouveau en crate
maximumDistancePackableUnitsSearch:
  group: crates
  description:
    en: Max distance to search for packable vehicles
    fr: Distance max pour chercher des véhicules pack-ables

# ── Troupes ──────────────────────────────────────────────────────────────────
numberOfTroops:
  group: troops
  standard: true
  description:
    en: Default / max troop group size per transport (overridden per aircraft by maxTroopsOnboard)
    fr: Taille de groupe de troops par défaut / max par transport (surchargée par appareil via maxTroopsOnboard)
allowRandomAiTeamPickups:
  group: troops
  standard: true
  description:
    en: Allow AI transports to randomly pick a troop template at pickup zones. When false, the AI always picks the first available template for its coalition
    fr: Autorise les transports IA à choisir aléatoirement un template de troop aux zones de pickup. Si false, l'IA prend toujours le premier template disponible pour sa coalition
troopPickupAtFOB:
  group: troops
  standard: true
  description:
    en: Allow troop pickup at built FOBs
    fr: Autorise le pickup de troops aux FOB construits
maxExtractDistance:
  group: troops
  standard: true
  description:
    en: Max distance from the vehicle to troops for extraction
    fr: Distance max entre le véhicule et les troops pour l'extraction
maximumSearchDistance:
  group: troops
  description:
    en: Max distance for deployed AI troops to search for enemies
    fr: Distance max pour que les troops IA déployées cherchent des ennemis

# ── Embarquement ─────────────────────────────────────────────────────────────
enableFastRopeInsertion:
  group: boarding
  standard: true
  description:
    en: Allow fast-rope deployment
    fr: Autorise le déploiement en fast-rope
fastRopeMaximumHeight:
  group: boarding
  standard: true
  description:
    en: Max height (m) for fast-rope insertion (≈ 60 ft)
    fr: Hauteur max (m) pour l'insertion fast-rope (≈ 60 ft)

# ── JTAC (incl. Smoke JTAC) ──────────────────────────────────────────────────
JTAC_lock:
  group: jtac
  standard: true
  choices: [all, vehicle, troop]
  description:
    en: 'Target filter: "vehicle" | "troop" | "all"'
    fr: 'Filtre de cible : "vehicle" | "troop" | "all"'
JTAC_LIMIT_BLUE:
  group: jtac
  standard: true
  description:
    en: Max JTAC objects BLUE may spawn (fixed quota — not refilled when a JTAC is killed)
    fr: Nombre max d'objets JTAC que BLUE peut spawn (quota fixe — non réapprovisionné lorsqu'un JTAC est tué)
JTAC_LIMIT_RED:
  group: jtac
  standard: true
  description:
    en: Max JTAC objects RED may spawn (same)
    fr: Nombre max d'objets JTAC que RED peut spawn (idem)
JTAC_dropEnabled:
  group: jtac
  standard: true
  description:
    en: Allow JTAC crate spawn from F10
    fr: Autorise le spawn de crate JTAC depuis F10
JTAC_maxDistance:
  group: jtac
  standard: true
  description:
    en: JTAC line-of-sight range (metres)
    fr: Portée en ligne de vue du JTAC (mètres)
JTAC_allow9Line:
  group: jtac
  standard: true
  description:
    en: Allow 9-line requests
    fr: Autorise les requêtes 9-line
JTAC_allowSmokeRequest:
  group: jtac
  standard: true
  description:
    en: Allow smoke-on-target requests
    fr: Autorise les requêtes de smoke-on-target
JTAC_allowStandbyMode:
  group: jtac
  standard: true
  description:
    en: Allow toggling lasing on/off
    fr: Autorise l'activation/désactivation du lasing
JTAC_smokeOn_BLUE:
  group: jtac
  standard: true
  description:
    en: Enable smoke marking for BLUE JTACs
    fr: Active le marquage smoke pour les JTAC BLUE
JTAC_smokeOn_RED:
  group: jtac
  standard: true
  description:
    en: Enable smoke marking for RED JTACs
    fr: Active le marquage smoke pour les JTAC RED
JTAC_smokeColour_BLUE:
  group: jtac
  standard: true
  description:
    en: BLUE JTAC smoke colour — 0=Green 1=Red 2=White 3=Orange 4=Blue
    fr: Couleur de smoke du JTAC BLUE — 0=Green 1=Red 2=White 3=Orange 4=Blue
JTAC_smokeColour_RED:
  group: jtac
  standard: true
  description:
    en: RED JTAC smoke colour — 0=Green 1=Red 2=White 3=Orange 4=Blue
    fr: Couleur de smoke du JTAC RED — 0=Green 1=Red 2=White 3=Orange 4=Blue
JTAC_WEIGHT:
  group: jtac
  description:
    en: JTAC laser + radio + binoculars (kg)
    fr: Laser + radio + jumelles du JTAC (kg)
JTAC_droneAltitude:
  group: jtac
  description:
    en: Fallback orbit altitude AGL (m) for drone JTACs when the crate has no specificParams
    fr: Altitude d'orbite de repli AGL (m) pour les JTAC drones quand la crate n'a pas de specificParams
JTAC_droneRadius:
  group: jtac
  description:
    en: Fallback orbit radius (m) for drone JTACs when the crate has no specificParams
    fr: Rayon d'orbite de repli (m) pour les JTAC drones quand la crate n'a pas de specificParams
JTAC_laseSpotCorrections:
  group: jtac
  description:
    en: Lead moving targets, accounting for wind and target speed
    fr: Anticipe les cibles mobiles, en tenant compte du vent et de la vitesse de la cible
JTAC_smokeMarginOfError:
  group: jtac
  description:
    en: Max random placement error radius (m) for smoke
    fr: Rayon max d'erreur de placement aléatoire (m) pour la smoke
JTAC_smokeOffset_x:
  group: jtac
  description:
    en: Fixed East/West offset (m) added before the random error
    fr: Offset Est/Ouest fixe (m) ajouté avant l'erreur aléatoire
JTAC_smokeOffset_y:
  group: jtac
  description:
    en: Fixed vertical offset (m) — keeps smoke visible above terrain
    fr: Offset vertical fixe (m) — garde la smoke visible au-dessus du terrain
JTAC_smokeOffset_z:
  group: jtac
  description:
    en: Fixed North/South offset (m) added before the random error
    fr: Offset Nord/Sud fixe (m) ajouté avant l'erreur aléatoire

# ── Smoke général ─────────────────────────────────────────────────────────────
disableAllSmoke:
  group: smoke
  standard: true
  description:
    en: Globally disable all smoke at pickup and drop-off zones
    fr: Désactive globalement toute la smoke aux zones de pickup et de drop-off
enableSmokeDrop:
  group: smoke
  standard: true
  description:
    en: Enable the "Drop Smoke" F10 entry
    fr: Active l'entrée F10 « Drop Smoke »

# ── Beacon ───────────────────────────────────────────────────────────────────
enabledRadioBeaconDrop:
  group: beacon
  standard: true
  description:
    en: Allow beacon deployment
    fr: Autorise le déploiement de beacon
deployedBeaconBattery:
  group: beacon
  standard: true
  description:
    en: Beacon battery life (minutes)
    fr: Durée de vie de la batterie du beacon (minutes)

# ── FOB / FARP ───────────────────────────────────────────────────────────────
enabledFOBBuilding:
  group: fob
  standard: true
  description:
    en: Allow FOB construction from crates
    fr: Autorise la construction de FOB depuis des crate
enableFARPRepack:
  group: fob
  standard: true
  description:
    en: Allow players to pack a deployed FARP scene back into crates for redeployment
    fr: Autorise les joueurs à pack une scène FARP déployée de nouveau en crate pour redéploiement
fobTroopPickupRadius:
  group: fob
  standard: true
  description:
    en: Radius (m) within which troops may board at a FOB
    fr: Rayon (m) dans lequel les troops peuvent embarquer à un FOB
fobDestructionThreshold:
  group: fob
  description:
    en: Fraction of scene objects destroyed before a FOB is considered lost (0.0–1.0)
    fr: Fraction d'objets de scène détruits avant qu'un FOB soit considéré perdu (0.0–1.0)
fobLogisticZoneRadius:
  group: fob
  description:
    en: Radius (m) of the logistic zone created around a deployed FOB
    fr: Rayon (m) de la zone logistique créée autour d'un FOB déployé
fobMinDistanceFromZones:
  group: fob
  description:
    en: Minimum distance (m) from any logistic zone at which a FOB may be deployed
    fr: Distance minimale (m) de toute zone logistique à laquelle un FOB peut être déployé
maximumDistanceLogistic:
  group: fob
  description:
    en: Max distance from a logistics zone to load or spawn a crate
    fr: Distance max depuis une zone logistique pour charger ou spawn une crate

# ── Reconnaissance ────────────────────────────────────────────────────────────
reconEnabled:
  group: recon
  standard: true
  description:
    en: Master switch — must be true for scan commands to work
    fr: Interrupteur maître — doit être true pour que les commandes de scan fonctionnent
reconF10Menu:
  group: recon
  standard: true
  description:
    en: Enable the RECON F10 submenu
    fr: Active le sous-menu F10 RECON
reconSearchRadius:
  group: recon
  standard: true
  description:
    en: Line-of-sight scan radius (metres)
    fr: Rayon de scan en ligne de vue (mètres)
reconMinAltitude:
  group: recon
  description:
    en: Minimum AGL altitude (m) required to perform a scan
    fr: Altitude AGL minimale (m) requise pour effectuer un scan
reconIconScale:
  group: recon
  description:
    en: Icon size multiplier (1.0 = default, 2.0 = double)
    fr: Multiplicateur de taille d'icône (1.0 = défaut, 2.0 = double)
reconRefreshInterval:
  group: recon
  description:
    en: Auto-refresh interval (seconds)
    fr: Intervalle de rafraîchissement automatique (secondes)

# ── Mines ─────────────────────────────────────────────────────────────────────
showMinefieldOnF10Map:
  group: mines
  standard: true
  description:
    en: Draw a bounding quad on the F10 map when a minefield is deployed
    fr: Dessine un quadrilatère englobant sur la carte F10 lorsqu'un minefield est déployé
demineRadius:
  group: mines
  standard: true
  description:
    en: Max distance (m) from the player to the minefield centre for the "Clear Mine Field" entry to appear
    fr: Distance max (m) du joueur au centre du minefield pour que l'entrée « Clear Mine Field » apparaisse

# ── Système AA ────────────────────────────────────────────────────────────────
aaLaunchers:
  group: aa
  standard: true
  description:
    en: Default number of launchers per AA system when the template does not specify
    fr: Nombre par défaut de launchers par système AA quand le template n'en précise pas
AASystemLimitBLUE:
  group: aa
  standard: true
  description:
    en: Max active AA systems for BLUE
    fr: Nombre max de systèmes AA actifs pour BLUE
AASystemLimitRED:
  group: aa
  standard: true
  description:
    en: Max active AA systems for RED
    fr: Nombre max de systèmes AA actifs pour RED
AASystemCrateStacking:
  group: aa
  description:
    en: Allow multiple crate sets to add extra launchers (N×crates → N×launchers)
    fr: Autorise plusieurs jeux de crate à ajouter des launchers supplémentaires (N×crates → N×launchers)

# ── Parachute ────────────────────────────────────────────────────────────────
autoUnpackRadiusParachute:
  group: parachute
  description:
    en: Radius (m) within which a parachuted crate auto-unpacks on landing
    fr: Rayon (m) dans lequel une crate parachutée se déballe automatiquement à l'atterrissage
parachuteDescentRateCrates:
  group: parachute
  description:
    en: Descent rate (m/s) for parachuted crates
    fr: Vitesse de descente (m/s) des crates en parachute
parachuteDescentRateTroops:
  group: parachute
  description:
    en: Descent rate (m/s) for parachuted troops
    fr: Vitesse de descente (m/s) des troupes en parachute
parachuteDescentRateVehicles:
  group: parachute
  description:
    en: Descent rate (m/s) for parachuted vehicles
    fr: Vitesse de descente (m/s) des véhicules en parachute
parachuteInertiaFactor:
  group: parachute
  description:
    en: Horizontal inertia factor applied to the crate velocity at drop (0–1, lower = less drift from aircraft speed)
    fr: Facteur d'inertie horizontale appliqué à la vitesse de la crate au largage (0–1, plus bas = moins de dérive due à la vitesse de l'appareil)
parachuteLateralDriftMax:
  group: parachute
  description:
    en: Maximum random lateral drift (m) during descent
    fr: Dérive latérale aléatoire maximale (m) pendant la descente
parachuteLateralDriftMin:
  group: parachute
  description:
    en: Minimum random lateral drift (m) during descent
    fr: Dérive latérale aléatoire minimale (m) pendant la descente
parachuteMinAltitudeCrates:
  group: parachute
  description:
    en: Minimum AGL altitude (m) at which crate parachute deployment triggers
    fr: Altitude AGL minimale (m) à laquelle le déploiement du parachute de la crate se déclenche
parachuteMinAltitudeTroops:
  group: parachute
  description:
    en: Minimum AGL altitude (m) at which troop parachute deployment triggers
    fr: Altitude AGL minimale (m) à laquelle le déploiement du parachute des troupes se déclenche
parachuteMinAltitudeVehicles:
  group: parachute
  description:
    en: Minimum AGL altitude (m) at which vehicle parachute deployment triggers
    fr: Altitude AGL minimale (m) à laquelle le déploiement du parachute des véhicules se déclenche

# ── Poids soldats ─────────────────────────────────────────────────────────────
SOLDIER_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Base body weight per soldier (kg)
    fr: Poids corporel de base par soldat (kg)
KIT_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Helmet + backpack per soldier (kg)
    fr: Casque + sac à dos par soldat (kg)
RIFLE_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Standard rifleman kit (kg)
    fr: Équipement standard de fusilier (kg)
MG_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Machine-gunner weapon + 200-round belt (kg)
    fr: Arme du mitrailleur + bande de 200 cartouches (kg)
RPG_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: AT soldier RPG + rocket (kg)
    fr: RPG + roquette du soldat AT (kg)
MANPAD_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: AA soldier MANPAD tube (kg)
    fr: Tube MANPAD du soldat AA (kg)
MORTAR_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Mortar crew tube + shells (kg)
    fr: Tube + obus de l'équipe de mortier (kg)
CIV_WEIGHT:
  group: soldier_weights
  standard: true
  description:
    en: Light personal items for the civilian role (kg)
    fr: Effets personnels légers pour le rôle civil (kg)

# Functional families — the `group:` values above, named and described for the UI.
#
# `label` was carried over from the TUI's `tui.family.*` i18n catalog (lot CTLD-TOOLS-TUI);
# `description` says what a Mission Maker will find in the family, derived from the settings and
# tables it actually holds. `order` drives the navigation: domain order (airframes, then what they
# carry, then where they operate, then the subsystems), not alphabetical.
families:
  general:
    order: 10
    label: { en: General, fr: Général }
    description:
      en: Cross-cutting settings — CTLD's interface language, coordinate format, beacon sound files and logging.
      fr: Réglages transversaux — langue de l'interface CTLD, format des coordonnées, fichiers son des beacons et journalisation.
  aircraft:
    order: 20
    label: { en: Aircraft, fr: Appareils }
    description:
      en: Which airframes may carry crates, troops and whole vehicles, how many of each, and the pilot slot names CTLD watches.
      fr: Quels appareils peuvent transporter caisses, troupes et véhicules entiers, en quelle quantité, et les noms de slots pilote surveillés par CTLD.
  crates:
    order: 30
    label: { en: Crates, fr: Caisses }
    description:
      en: Spawning, sling-loading and unpacking supply crates — and the catalogue of crates a mission can request.
      fr: Apparition, transport à l'élingue et déballage des caisses de ravitaillement — et le catalogue des caisses qu'une mission peut demander.
  troops:
    order: 40
    label: { en: Troops, fr: Troupes }
    description:
      en: Loading, deploying and extracting infantry — and the troop groups a transport can board.
      fr: Embarquement, déploiement et extraction de l'infanterie — et les groupes de troupes qu'un transport peut charger.
  zones:
    order: 50
    label: { en: Zones, fr: Zones }
    description:
      en: The mission zones CTLD works with — troop pickup, waypoint and AI transport zones — and their default radius.
      fr: Les zones de mission utilisées par CTLD — pickup de troupes, waypoint et transport IA — et leur rayon par défaut.
  boarding:
    order: 60
    label: { en: Boarding, fr: Embarquement }
    description:
      en: How troops get aboard and back down, including fast-rope insertion and its height limit.
      fr: Comment les troupes montent à bord et redescendent, dont l'insertion en fast-rope et sa hauteur limite.
  fob:
    order: 70
    label: { en: FOB / FARP, fr: FOB / FARP }
    description:
      en: Building and running Forward Operating Bases and FARPs — crate collection radius, spacing rules and what a built FOB offers.
      fr: Construction et fonctionnement des FOB et FARP — rayon de collecte des caisses, règles d'espacement et ce qu'une FOB offre.
  jtac:
    order: 80
    label: { en: JTAC, fr: JTAC }
    description:
      en: Deployed JTACs — target search and lasing, smoke marking, 9-line, laser codes and drone JTAC behaviour.
      fr: JTAC déployés — recherche et lasing des cibles, marquage à la fumée, 9-line, codes laser et comportement des JTAC drones.
  recon:
    order: 90
    label: { en: Recon, fr: Reconnaissance }
    description:
      en: Aerial reconnaissance — what a recon flight detects, at what altitude and radius, and how it is drawn on the F10 map.
      fr: Reconnaissance aérienne — ce qu'un vol de reconnaissance détecte, à quelle altitude et dans quel rayon, et son rendu sur la carte F10.
  aa:
    order: 100
    label: { en: AA system, fr: Système AA }
    description:
      en: Anti-air systems assembled from crates — how many each coalition may build, assembly distance and rearming.
      fr: Systèmes anti-aériens assemblés depuis des caisses — combien chaque coalition peut en construire, distance d'assemblage et réapprovisionnement.
  beacon:
    order: 110
    label: { en: Beacons, fr: Beacons }
    description:
      en: Radio beacons dropped in the field — battery life, removal radius and how they appear on the F10 map.
      fr: Beacons radio largués sur le terrain — autonomie, rayon de retrait et affichage sur la carte F10.
  smoke:
    order: 120
    label: { en: Smoke, fr: Fumigènes }
    description:
      en: Smoke markers dropped by transports — whether they may be dropped at all, and how they are refreshed.
      fr: Fumigènes largués par les transports — s'ils peuvent l'être, et leur rafraîchissement.
  mines:
    order: 130
    label: { en: Mines, fr: Mines }
    description:
      en: Minefields — clearing radius and whether they are shown on the F10 map.
      fr: Champs de mines — rayon de déminage et affichage sur la carte F10.
  parachute:
    order: 140
    label: { en: Parachute, fr: Parachute }
    description:
      en: Physics of parachute drops — descent rates, deployment altitudes and how far a load drifts before it lands.
      fr: Physique des largages sous parachute — vitesses de descente, altitudes de déploiement et dérive avant l'atterrissage.
  soldier_weights:
    order: 150
    label: { en: Soldier weights, fr: Poids soldats }
    description:
      en: Per-soldier weights, used to check whether a troop group fits inside a transport.
      fr: Poids par soldat, utilisés pour vérifier qu'un groupe de troupes tient dans un transport.
  other:
    order: 999
    label: { en: Other, fr: Autres }
    description:
      en: Settings not yet attached to a specific subsystem.
      fr: Réglages pas encore rattachés à un sous-système précis.

# Table field descriptions — used by ctld-tools forms for tooltips.
# Each table has named fields with { en, fr } descriptions.
tableFields:
  spawnableCrates:
    desc:
      en: Display name shown in the F10 menu
      fr: Nom affiché dans le menu F10
    unit:
      en: DCS unit type name (must match the DCS catalogue exactly)
      fr: Nom du type d'unité DCS (doit correspondre exactement au catalogue DCS)
    weight_kg:
      en: Unique crate mass in kg — also the runtime key; must be unique across all crates

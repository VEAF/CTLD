# Functional families — the `group:` values above, named and described for the UI.
#
# `label` was carried over from the TUI's `tui.family.*` i18n catalog (lot CTLD-TOOLS-TUI);
# `description` says what a Mission Maker will find in the family, derived from the settings and
# tables it actually holds. `order` drives the navigation: domain order (airframes, then what they
# carry, then where they operate, then the subsystems), not alphabetical.
families:
  general:
    order: 10
    label: {en: General, fr: Général}
    description:
      en: Cross-cutting settings — CTLD's interface language, coordinate format, beacon sound files and logging.
      fr: Réglages transversaux — langue de l'interface CTLD, format des coordonnées, fichiers son des beacons et journalisation.
  aircraft:
    order: 20
    label: {en: Aircraft, fr: Appareils}
    description:
      en: Which airframes may carry crates, troops and whole vehicles, how many of each, and the pilot slot names CTLD watches.
      fr: Quels appareils peuvent transporter caisses, troupes et véhicules entiers, en quelle quantité, et les noms de slots pilote surveillés par CTLD.
  crates:
    order: 30
    label: {en: Crates, fr: Caisses}
    description:
      en: Spawning, sling-loading and unpacking supply crates — and the catalogue of crates a mission can request.
      fr: Apparition, transport à l'élingue et déballage des caisses de ravitaillement — et le catalogue des caisses qu'une mission peut demander.
  troops:
    order: 40
    label: {en: Troops, fr: Troupes}
    description:
      en: Loading, deploying and extracting infantry — and the troop groups a transport can board.
      fr: Embarquement, déploiement et extraction de l'infanterie — et les groupes de troupes qu'un transport peut charger.
  zones:
    order: 50
    label: {en: Zones, fr: Zones}
    description:
      en: The mission zones CTLD works with — troop pickup, waypoint and AI transport zones — and their default radius.
      fr: Les zones de mission utilisées par CTLD — pickup de troupes, waypoint et transport IA — et leur rayon par défaut.
  boarding:
    order: 60
    label: {en: Boarding, fr: Embarquement}
    description:
      en: How troops get aboard and back down, including fast-rope insertion and its height limit.
      fr: Comment les troupes montent à bord et redescendent, dont l'insertion en fast-rope et sa hauteur limite.
  fob:
    order: 70
    label: {en: FOB / FARP, fr: FOB / FARP}
    description:
      en: Building and running Forward Operating Bases and FARPs — crate collection radius, spacing rules and what a built FOB offers.
      fr: Construction et fonctionnement des FOB et FARP — rayon de collecte des caisses, règles d'espacement et ce qu'une FOB offre.
  jtac:
    order: 80
    label: {en: JTAC, fr: JTAC}
    description:
      en: Deployed JTACs — target search and lasing, smoke marking, 9-line, laser codes and drone JTAC behaviour.
      fr: JTAC déployés — recherche et lasing des cibles, marquage à la fumée, 9-line, codes laser et comportement des JTAC drones.
  recon:
    order: 90
    label: {en: Recon, fr: Reconnaissance}
    description:
      en: Aerial reconnaissance — what a recon flight detects, at what altitude and radius, and how it is drawn on the F10 map.
      fr: Reconnaissance aérienne — ce qu'un vol de reconnaissance détecte, à quelle altitude et dans quel rayon, et son rendu sur la carte F10.
  aa:
    order: 100
    label: {en: AA system, fr: Système AA}
    description:
      en: Anti-air systems assembled from crates — how many each coalition may build, assembly distance and rearming.
      fr: Systèmes anti-aériens assemblés depuis des caisses — combien chaque coalition peut en construire, distance d'assemblage et réapprovisionnement.
  beacon:
    order: 110
    label: {en: Beacons, fr: Beacons}
    description:
      en: Radio beacons dropped in the field — battery life, removal radius and how they appear on the F10 map.
      fr: Beacons radio largués sur le terrain — autonomie, rayon de retrait et affichage sur la carte F10.
  smoke:
    order: 120
    label: {en: Smoke, fr: Fumigènes}
    description:
      en: Smoke markers dropped by transports — whether they may be dropped at all, and how they are refreshed.
      fr: Fumigènes largués par les transports — s'ils peuvent l'être, et leur rafraîchissement.
  mines:
    order: 130
    label: {en: Mines, fr: Mines}
    description:
      en: Minefields — clearing radius and whether they are shown on the F10 map.
      fr: Champs de mines — rayon de déminage et affichage sur la carte F10.
  parachute:
    order: 140
    label: {en: Parachute, fr: Parachute}
    description:
      en: Physics of parachute drops — descent rates, deployment altitudes and how far a load drifts before it lands.
      fr: Physique des largages sous parachute — vitesses de descente, altitudes de déploiement et dérive avant l'atterrissage.
  soldier_weights:
    order: 150
    label: {en: Soldier weights, fr: Poids soldats}
    description:
      en: Per-soldier weights, used to check whether a troop group fits inside a transport.
      fr: Poids par soldat, utilisés pour vérifier qu'un groupe de troupes tient dans un transport.
  other:
    order: 999
    label: {en: Other, fr: Autres}
    description:
      en: Settings not yet attached to a specific subsystem.
      fr: Réglages pas encore rattachés à un sous-système précis.

# Table field descriptions — used by ctld-tools forms for tooltips.
# Each table has named fields with { en, fr } descriptions.
tableFields:
  spawnableCrates:
    desc:
      en: Display name shown in the F10 menu
      fr: Nom affiché dans le menu F10
    unit:
      en: DCS unit type name (must match the DCS catalogue exactly)
      fr: Nom du type d'unité DCS (doit correspondre exactement au catalogue DCS)
    weight_kg:
      en: Unique crate mass in kg — also the runtime key; must be unique across all crates
      fr: Masse unique de la crate en kg — aussi la clé runtime ; doit être unique parmi toutes les crates
    cratesRequired:
      en: Number of crates needed to unpack this item (default 1)
      fr: Nombre de crates nécessaires pour déballer cet objet (défaut 1)
    side:
      en: "Coalition restriction: 1 = RED, 2 = BLUE, omit = both"
      fr: "Restriction de coalition : 1 = RED, 2 = BLUE, omettre = les deux"
    isJTAC:
      en: Mark this spawn as a JTAC unit
      fr: Marque ce spawn comme unité JTAC
    spawnAs:
      en: "Force spawn category: AIRPLANE, HELICOPTER, GROUND_UNIT, etc."
      fr: "Force la catégorie de spawn : AIRPLANE, HELICOPTER, GROUND_UNIT, etc."
    specificParams:
      en: Drone JTAC orbit parameters (altitude, radii, speed) — only for Drone family
      fr: Paramètres d'orbite du JTAC drone (altitude, rayons, vitesse) — uniquement famille Drone
    specificParams.alti:
      en: Orbit altitude AGL (m)
      fr: Altitude d'orbite AGL (m)
    specificParams.orbitRadiusNoLase:
      en: Orbit radius when not lasing (m)
      fr: Rayon d'orbite sans lasing (m)
    specificParams.orbitRadiusOnLase:
      en: Orbit radius when lasing (m)
      fr: Rayon d'orbite en lasing (m)
    specificParams.speed:
      en: Orbit airspeed (km/h)
      fr: Vitesse d'orbite (km/h)
  loadableGroups:
    name:
      en: Display name shown in the F10 boarding menu
      fr: Nom affiché dans le menu d'embarquement F10
    inf:
      en: Number of infantry soldiers
      fr: Nombre de soldats d'infanterie
    mg:
      en: Number of machine-gunners
      fr: Nombre de mitrailleurs
    at:
      en: Number of anti-tank soldiers (RPG)
      fr: Nombre de soldats anti-char (RPG)
    aa:
      en: Number of anti-air soldiers (MANPAD)
      fr: Nombre de soldats anti-aérien (MANPAD)
    mortar:
      en: Number of mortar crew members
      fr: Nombre de membres d'équipe de mortier
    jtac:
      en: Number of JTAC soldiers
      fr: Nombre de soldats JTAC
  capabilitiesByType:
    cratesEnabled:
      en: Allow this aircraft to carry and drop crates
      fr: Autorise cet appareil à transporter et larguer des crates
    troopsEnabled:
      en: Allow this aircraft to carry and deploy troops
      fr: Autorise cet appareil à transporter et déployer des troops
    canSlingload:
      en: Allow DCS sling-load for this aircraft
      fr: Autorise le sling-load DCS pour cet appareil
    canParachuteDrop:
      en: Allow parachute troop drops from this aircraft
      fr: Autorise le saut en parachute de troops depuis cet appareil
    useNativeDcsCargoSystem:
      en: Use the DCS native cargo weight system instead of the CTLD virtual system
      fr: Utilise le système de poids cargo natif DCS au lieu du système virtuel CTLD
    canTransportWholeVehicle:
      en: Allow loading and transporting whole vehicles (requires loadableVehiclesBLUE/RED)
      fr: Autorise le chargement et le transport de véhicules entiers (nécessite loadableVehiclesBLUE/RED)
    convertNativeLoadToCTLD:
      en: Convert a native DCS cargo load to a CTLD crate on board
      fr: Convertit un cargo natif DCS en crate CTLD à bord
    maxCratesOnboard:
      en: Maximum number of crates this aircraft can carry simultaneously
      fr: Nombre maximum de crates que cet appareil peut transporter simultanément
    maxTroopsOnboard:
      en: Maximum number of troops this aircraft can carry simultaneously
      fr: Nombre maximum de troops que cet appareil peut transporter simultanément
    maxWholeVehiclesOnboard:
      en: Maximum number of whole vehicles this aircraft can carry
      fr: Nombre maximum de véhicules entiers que cet appareil peut transporter
    maxVehicleWeight:
      en: Maximum vehicle weight (kg) this aircraft can carry
      fr: Poids maximum du véhicule (kg) que cet appareil peut transporter
    loadableVehiclesBLUE:
      en: List of BLUE coalition vehicle types this aircraft can carry whole
      fr: Liste des types de véhicules de la coalition BLUE que cet appareil peut transporter entiers
    loadableVehiclesRED:
      en: List of RED coalition vehicle types this aircraft can carry whole
      fr: Liste des types de véhicules de la coalition RED que cet appareil peut transporter entiers
  troopZones:
    zoneName:
      en: DCS trigger zone name (must exist in the mission editor)
      fr: Nom de la zone de déclenchement DCS (doit exister dans l'éditeur de mission)
    colour:
      en: "Smoke colour at pickup: blue, red, green, orange, none"
      fr: "Couleur de smoke au pickup : blue, red, green, orange, none"
    troopLimit:
      en: Max troops deployable from this zone (-1 = unlimited)
      fr: Nombre max de troops déployables depuis cette zone (-1 = illimité)
    canPickup:
      en: "Allow picking up troops from this zone: yes / no"
      fr: "Autorise le pickup de troops depuis cette zone : yes / no"
    groupSize:
      en: Override default group size for this zone (0 = use global default)
      fr: Surcharge la taille de groupe par défaut pour cette zone (0 = utilise le défaut global)
    iconId:
      en: Optional F10 map icon ID override for this zone
      fr: Identifiant d'icône F10 optionnel de remplacement pour cette zone
  wpZones:
    zoneName:
      en: DCS trigger zone name (must exist in the mission editor)
      fr: Nom de la zone de déclenchement DCS (doit exister dans l'éditeur de mission)
    colour:
      en: "Smoke colour at waypoint: blue, red, green, orange, none"
      fr: "Couleur de smoke au waypoint : blue, red, green, orange, none"
    canPickup:
      en: "Allow troops to board at this waypoint zone: yes / no"
      fr: "Autorise l'embarquement de troops dans cette zone de waypoint : yes / no"
    side:
      en: "Coalition that can use this zone: 0 = both, 1 = RED, 2 = BLUE"
      fr: "Coalition autorisée à utiliser cette zone : 0 = les deux, 1 = RED, 2 = BLUE"
  AIZones:
    zoneName:
      en: DCS trigger zone name for the AI zone (must exist in the mission editor)
      fr: Nom de la zone de déclenchement DCS pour la zone IA (doit exister dans l'éditeur de mission)
    mode:
      en: "AI zone mode: supply, pickup, unload, etc."
      fr: "Mode de la zone IA : supply, pickup, unload, etc."
    side:
      en: "Coalition that uses this AI zone: 0 = both, 1 = RED, 2 = BLUE"
      fr: "Coalition qui utilise cette zone IA : 0 = les deux, 1 = RED, 2 = BLUE"
  groundVehicleWeights:
    unit:
      en: DCS unit type name (must match the DCS catalogue exactly)
      fr: Nom du type d'unité DCS (doit correspondre exactement au catalogue DCS)
    weight_kg:
      en: Vehicle weight in kg — used for whole-vehicle transport weight checks
      fr: Poids du véhicule en kg — utilisé pour les vérifications de poids de transport de véhicule entier


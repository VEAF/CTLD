    fr: Zones où les transports IA embarquent ou débarquent. Une liste d'enregistrements comportant dcsZoneName, coalition (RED/BLUE/NEUTRAL), isPickup, isDropoff, cargoType (T=troupes, V=véhicules) et, en option, des tables troopStock / vehicleStock associant un nom de modèle à un nombre (-1 = illimité, "All" = tous les modèles).

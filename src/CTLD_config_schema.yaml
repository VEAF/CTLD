# CTLD settings schema — authoring metadata for ctld-tools (the web app / validate).
#
# NOT consumed by the build (gen-config) — it only guides the authoring tool. Additive:
# one entry per setting name, with any of:
#   group:        functional family key (see the `families:` section below)
#   standard:     true = shown under "Common settings"; false/absent = Advanced
#   choices:      allowed values (a fixed enum) — offered as a value list
#   label:        { en, fr } short display name, shown instead of the raw config key
#   unit:         unit symbol shown next to a numeric value ("m", "s", "min", "m/s", "kg").
#                 Not translated — symbols are language-independent. Each one was traced to
#                 the code that consumes the value (see .backlog/CTLD-TOOLS-MM-UX ticket 14);
#                 settings that are counters, codes, fractions or multipliers have none, on
#                 purpose. `deployedBeaconBattery` is the only one the engine converts (× 60).
#   description:  { en, fr } help text — shown and searchable in the settings picker
#
# Two reserved top-level sections are not settings: `families:` (per-family label /
# description / navigation order) and `tableFields:` (per-field help for the structured
# tables).
#
# Descriptions were seeded from docs/mission-maker/configuration(.fr).md; the schema is
# now their source of truth (see dev/roadmap.md: generate the doc tables from it). Labels
# restate the setting's own name and description — they never add a new claim about
# behaviour; a setting with no `label:` falls back to one derived from its key.

# ── Général ──────────────────────────────────────────────────────────────────
i18n_lang:
  group: general
  standard: true
  # Not in the engine defaults catalogue (it is a bare `ctld.i18n_lang` global read by
  # CTLD_i18n); `default` here surfaces it in the TUI picker. The user-config value, when
  # set, lands in settings and wins via ctld.gs("i18n_lang").
  default: en
  choices: [en, fr, es, ko]
  label: {en: CTLD interface language, fr: Langue de l'interface CTLD}
  description:
    en: 'CTLD interface language: en, fr, es or ko'
    fr: "Langue de l'interface CTLD : en, fr, es ou ko"
location_DMS:
  group: general
  standard: true
  label: {en: Coordinates in degrees-minutes-seconds, fr: Coordonnées en degrés-minutes-secondes}
  description:
    en: Show coordinates as Degrees-Minutes-Seconds instead of Degrees-Decimal-Minutes
    fr: Affiche les coordonnées en Degrés-Minutes-Secondes au lieu de Degrés-Minutes-Décimales
radioSound:
  group: general
  standard: true
  label: {en: Beacon sound file, fr: Fichier son du beacon}
  description:
    en: Beacon sound file — must be added to the mission .miz, or beacons will not work
    fr: Fichier son du beacon — doit être ajouté au .miz de la mission, sinon les beacon ne fonctionneront pas
radioSoundFC3:
  group: general
  standard: true
  label: {en: Silent beacon file for FC3, fr: Fichier de beacon silencieux FC3}
  description:
    en: Silent beacon file for FC3 aircraft
    fr: Fichier de beacon silencieux pour les appareils FC3
addPlayerAircraftByType:
  group: general
  label: {en: Detect player units by type, fr: Détecter les unités joueur par type}
  description:
    en: How CTLD selects player units that receive menus
    fr: Comment CTLD sélectionne les unités joueur qui reçoivent les menus
debug:
  group: general
  label: {en: Verbose logging, fr: Journalisation détaillée}
  description:
    en: Verbose logging to CTLD.log (requires a non-sanitized DCS install)
    fr: Journalisation verbeuse vers CTLD.log (nécessite une installation DCS non sanitized)
debugScreenLog:
  group: general
  label: {en: Echo log to the DCS screen, fr: Répéter le log à l'écran DCS}
  description:
    en: Also echo log messages to the DCS screen via outText
    fr: Répète aussi les messages de log à l'écran DCS via outText
ctldLogPath:
  group: general
  label: {en: Log file path, fr: Chemin du fichier de log}
  description:
    en: Override the log file path; empty = default DCS Saved Games folder
    fr: Surcharge le chemin du fichier de log ; vide = dossier Saved Games DCS par défaut

# ── Caisses ──────────────────────────────────────────────────────────────────
enableCrates:
  group: crates
  standard: true
  label: {en: Enable crates, fr: Activer les caisses}
  description:
    en: Master switch for crate spawning and unpacking
    fr: Interrupteur maître pour le spawn et le déballage des crate
enableAllCrates:

name: CI

on:
  push:
    branches: [develop, master]
    tags: ['v*']            # release job (owned by the RELEASE lot)
  pull_request:
    branches: [develop, master]
  workflow_dispatch:        # manual trigger from the Actions UI

jobs:
  # ─────────────────────────────────────────────────────────────
  # Lua 5.1 syntax check (all src/**/*.lua) — luac5.1 -p (parse-only)
  # Catches constructs invalid in DCS (goto, <const>, integer suffixes…).
  # ─────────────────────────────────────────────────────────────
  lua-lint:
    name: Lua 5.1 Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get install -y lua5.1
      - name: Syntax-check src/ with luac5.1
        run: |
          failed=0; total=0
          while IFS= read -r -d '' f; do
            total=$((total + 1))
            if ! luac5.1 -p "$f" 2>/tmp/luac_err; then
              echo "::error file=$f::$(cat /tmp/luac_err)"
              failed=$((failed + 1))
            fi
          done < <(find src -name "*.lua" -print0)
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed / $total Lua file(s) failed Lua 5.1 syntax check."
            exit 1
          fi
          echo "Lua 5.1 syntax OK — $total file(s) checked."

  # ─────────────────────────────────────────────────────────────
  # Formatting check — stylua (see stylua.toml). REPORT-ONLY for now
  # (continue-on-error): the codebase predates stylua and a reviewed
  # baseline reformat + config sign-off is a dedicated follow-up before
  # this gate becomes blocking.
  # ─────────────────────────────────────────────────────────────
  stylua:
    name: Stylua Format Check (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: latest
          args: --check src/ tests/

  # ─────────────────────────────────────────────────────────────
  # Secret scanning — gitleaks (public repo, free). See .gitleaks.toml.
  # ─────────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --no-banner --redact -v

  # ─────────────────────────────────────────────────────────────
  # Merge build — single source of truth: tools/build/merge_CTLD.ps1.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Merge Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CTLD_Next.lua
        run: powershell -ExecutionPolicy Bypass -File tools\build\merge_CTLD.ps1
        shell: pwsh
      - name: Verify output exists and is non-empty
        run: |
          if (-not (Test-Path CTLD_Next.lua)) { Write-Host "::error::CTLD_Next.lua not produced"; exit 1 }
          if ((Get-Item CTLD_Next.lua).Length -eq 0) { Write-Host "::error::CTLD_Next.lua is empty"; exit 1 }
        shell: pwsh
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTLD_Next
          path: CTLD_Next.lua
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # busted tests (tests/ci/**/*_spec.lua) with coverage ratchet.
  # DCS API is stubbed in tests/ci/helpers/. Coverage floor only goes up.
  # ─────────────────────────────────────────────────────────────
  busted:
    name: busted Tests
    runs-on: ubuntu-latest
    env:
      # Coverage ratchet floor (%). RULE: only ever increase, never decrease.
      # First measured coverage was 61.56%; floor seeded at measured - ~2.5 (ticket 04).
      COVERAGE_FLOOR: '59'
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua + LuaRocks + busted + luacov
        run: |
          sudo apt-get install -y lua5.1 liblua5.1-dev luarocks
          sudo luarocks install busted
          sudo luarocks install luacov
      - name: Run busted with coverage
        run: busted --coverage tests/ci/
      - name: Enforce coverage ratchet
        run: |
          luacov
          # The luacov Total line is: "Total  <hits> <missed> <pct>%" — take the last field.
          total=$(awk '/^Total/ { v=$NF; sub("%","",v); print v }' luacov.report.out | tail -1)
          if [ -z "$total" ]; then
            echo "::error::Could not parse coverage total from luacov.report.out"
            tail -20 luacov.report.out || true
            exit 1
          fi
          echo "Coverage: ${total}%  (floor: ${COVERAGE_FLOOR}%)"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { exit !(t >= f) }' || {
            echo "::error::Coverage ${total}% is below the ratchet floor ${COVERAGE_FLOOR}%."
            exit 1
          }

  # ─────────────────────────────────────────────────────────────
  # GitHub Release (version tags v*) — OWNED BY THE RELEASE LOT.
  # Left as-is for now; the RELEASE lot will consolidate its build with
  # tools/build/merge_CTLD.ps1 and add release notes.
  # ─────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build CTLD_Next.lua
        run: powershell -ExecutionPolicy Bypass -File tools\build\merge_CTLD.ps1
        shell: pwsh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag CTLD_Next.lua `
            --title "CTLD $tag" `
            --notes "Build produced automatically from ``src/`` by the CI pipeline."
        shell: pwsh

site_name: CTLD
site_description: Combined Transport and Logistics Dispatcher for DCS World — modular rewrite.
site_url: https://veaf.github.io/CTLD/
repo_url: https://github.com/VEAF/CTLD
repo_name: VEAF/CTLD
docs_dir: docs
edit_uri: blob/develop/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: [en, fr]
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true

extra:
  version:
    provider: mike
    default: dev

# NOTE: docs are currently flat, EN-only. The role-based restructure
# (pilot / mission-maker / developer) and FR translations land in the
# DOC-TECH and DOC-USER-ROLES lots.
nav:
  - Home: index.md
  - Mission Maker: missionmaker_guide.md
  - Developer: dev-guide.md
  - API Reference: api-reference.md
  - Integration Testing: recette-procedure.md
